<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>Soluciones para la investigación | OpenAI</title>
</head>

<body>
    <header class="header">
        <div class="header__title">
            <a class="header__icon" href="https://openai.com/es-419/">
                <img src="./img/OpenAI.svg" alt="logo de OpenAI" />
            </a>
            <a class="header__text" href="https://openai.com/es-419/business/">
                <span>Business</span>
            </a>
        </div>
        <nav class="header__navbar">
            <ul>
                <li class="header__list-link"><span>¿Por qué OpenAI?</span></li>
                <li class="header__list-link"><span> Productos </span></li>
                <li class="header__list-link"><span> Soluciones </span></li>
                <li class="header__list-link"><span> Recursos </span></li>
                <li class="header__list-link header__list-link--nav">
                    <span>
                        <a href="https://openai.com/es-419/business/customer-stories/">Clientes</a>
                    </span>
                </li>
                <li class="header__list-link header__list-link--nav">
                    <span>

                        <a href="https://openai.com/es-419/business/pricing/">Precios</a>
                    </span>
                </li>
            </ul>
        </nav>
        <div class="header__serch">
            <button class="header__btn-serch">
                <img class="header__icon-serch" src="./img/lupa.svg" alt="icono de lupa" />
            </button>
        </div>
        <div class="header__info">
                <button class="header__info-btn header__info-btn--dark">
                    Prueba OpenAI
                    <img class="header__icon-flecha" src="./img/flecha_bajo.svg"
                        alt="icono de una flecha hacia abajo" />
                </button>
            <button class="header__info-btn header__info-btn--light">
                <a href="https://openai.com/es-419/contact-sales/">
                    Hablar con un experto
                </a>
            </button>
        </div>
    </header>
</body>

</html>
